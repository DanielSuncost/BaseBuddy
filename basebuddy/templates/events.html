{% extends "base.html" %}
{% block title %}Events{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/events.css') }}">
{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title"><span class="material-icons-outlined">history</span> Events</h1>
    <p class="page-subtitle">Track-based timeline — clips, snapshots, and <a href="/config/setup">alert setup</a></p>
</div>

<div class="events-toolbar card">
    <label>Camera
        <select id="ev-filter-camera"><option value="">All</option></select>
    </label>
    <label>Class
        <input type="text" id="ev-filter-class" placeholder="person, car…">
    </label>
    <label>Hours
        <select id="ev-filter-hours">
            <option value="24">24h</option>
            <option value="48">48h</option>
            <option value="168" selected>7d</option>
        </select>
    </label>
    <button type="button" class="btn btn-secondary" id="ev-refresh"><span class="material-icons-outlined">refresh</span> Refresh</button>
</div>

<div class="events-list card" id="events-list">
    <p class="events-loading">Loading…</p>
</div>

<script src="{{ url_for('static', filename='js/events.js') }}"></script>
{% endblock %}
