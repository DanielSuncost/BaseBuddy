# BaseBuddy - run the app in Docker
# Copy env.example to .env and configure cameras, then:
#   docker compose up -d
#
# Local (non-Docker) production start:
#   ./setup.sh && ./run.sh
#   ./run.sh background   # detached
#   ./stop.sh

services:
  basebuddy:
    build: .
    image: basebuddy:1.0.0
    container_name: basebuddy
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      # Persist recordings and generated data
      - ./recordings:/app/recordings
      - ./stills:/app/stills
      - ./timelapse_output:/app/timelapse_output
      - ./logs:/app/logs
      # Optional: mount config so you can edit without rebuild
      # - ./config.txt:/app/config.txt:ro
    restart: unless-stopped
    # For GPU: uncomment below and use a CUDA base image in Dockerfile
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
